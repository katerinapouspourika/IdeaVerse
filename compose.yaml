# Local stack: PostgreSQL, the API (which also serves the web app), and Mailpit to catch emails.
#   docker compose up --build
# Open http://localhost:8080 for the app and http://localhost:8025 for the emails it sends.
# The API applies database migrations on startup.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ideaverse
      POSTGRES_USER: ideaverse
      POSTGRES_PASSWORD: ideaverse
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ideaverse -d ideaverse"]
      interval: 5s
      timeout: 5s
      retries: 10

  mail:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: final
      args:
        PUBLISHED_PROJECT: IdeaVerse.Api
        WEB_PROJECT: IdeaVerse.Web
        RUNTIME_BASE: web
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__IdeaVerse: Host=db;Port=5432;Database=ideaverse;Username=ideaverse;Password=ideaverse
      Database__MigrateOnStartup: "true"
      Email__SmtpHost: mail
      Email__SmtpPort: "1025"
      Reminders__AppUrl: http://localhost:8080

volumes:
  db-data:
