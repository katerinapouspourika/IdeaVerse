# Local development stack: PostgreSQL plus the API.
#   docker compose up --build
# The API listens on http://localhost:8080 and applies database migrations on startup.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ideaverse
      POSTGRES_USER: ideaverse
      POSTGRES_PASSWORD: ideaverse
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ideaverse -d ideaverse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: final
      args:
        PUBLISHED_PROJECT: IdeaVerse.Api
        RUNTIME_BASE: web
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__IdeaVerse: Host=db;Port=5432;Database=ideaverse;Username=ideaverse;Password=ideaverse
      Database__MigrateOnStartup: "true"

volumes:
  db-data:
